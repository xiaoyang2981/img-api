<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审核台</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root {
        --bg: #12141a; --panel: rgba(255,255,255,.05); --panel-hover: rgba(255,255,255,.08);
        --border: rgba(255,255,255,.12); --text: #e8ebf2; --muted: #8b93a7;
        --accent: #50b7fe; --danger: #e74c3c; --ok: #2ecc71; --warn: #f1c40f;
    }
    body {
        background: radial-gradient(1200px 600px at 20% -10%, #1b2740 0%, var(--bg) 55%);
        color: var(--text); font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
        min-height: 100vh; padding: 24px;
    }
    a { color: var(--accent); text-decoration: none; }
    .wrap { max-width: 1280px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { font-size: 1.3rem; }
    h1 span { color: var(--muted); font-size: .78rem; font-weight: 400; margin-left: 8px; }
    .account { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
    .account .who b { color: var(--ok); }
    .account .who .role { color: var(--accent); margin-left: 5px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tab {
        font: inherit; font-size: .84rem; color: var(--muted); background: var(--panel);
        border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; cursor: pointer;
    }
    .tab b { color: var(--text); margin-left: 5px; }
    .tab.active { color: #fff; background: rgba(80,183,254,.18); border-color: rgba(80,183,254,.5); }
    .tab.active b { color: #a9dbff; }
    button {
        font: inherit; background: linear-gradient(45deg, #50b7fe, #3aa7fe); color: #fff;
        border: none; border-radius: 9px; padding: 8px 14px; font-size: .82rem; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.ghost { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
    button.ghost:hover { background: var(--panel-hover); }
    button.danger { background: rgba(231,76,60,.16); border: 1px solid rgba(231,76,60,.4); color: #ff8d80; }
    button.ok { background: rgba(46,204,113,.16); border: 1px solid rgba(46,204,113,.42); color: #6ee7a4; }
    button.mini { padding: 6px 10px; font-size: .76rem; }
    .grid {
        display: grid; gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }
    .card {
        background: var(--panel); border: 1px solid var(--border); border-radius: 13px;
        overflow: hidden; display: flex; flex-direction: column;
    }
    .card img {
        display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
        background: #0b0d12; cursor: zoom-in;
    }
    .card .body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: .74rem; color: var(--muted); }
    .badge { font-size: .68rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--border); }
    .badge.approved { color: #6ee7a4; border-color: rgba(46,204,113,.4); background: rgba(46,204,113,.1); }
    .badge.pending { color: #ffd75e; border-color: rgba(241,196,15,.4); background: rgba(241,196,15,.1); }
    .badge.rejected { color: #ff8d80; border-color: rgba(231,76,60,.4); background: rgba(231,76,60,.1); }
    .title { font-size: .88rem; font-weight: 600; line-height: 1.5; word-break: break-all; }
    .sub { color: var(--muted); font-size: .74rem; line-height: 1.6; }
    .tags { color: var(--accent); font-size: .73rem; line-height: 1.5; word-break: break-all; }
    .note { color: #ffb86b; font-size: .74rem; line-height: 1.6; }
    .actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 4px; }
    .empty { color: var(--muted); text-align: center; padding: 60px 10px; font-size: .88rem; }
    .pager { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; }
    .pager .info { color: var(--muted); font-size: .82rem; }
    .toast {
        position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px);
        background: #1e2430; border: 1px solid var(--border); padding: 10px 18px; border-radius: 10px;
        font-size: .86rem; opacity: 0; pointer-events: none; transition: .25s; z-index: 80;
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
    .toast.err { border-color: rgba(231,76,60,.5); color: #ff9d92; }
</style>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body>
<div class="wrap">
    <header>
        <h1>🛡️ 审核台 <span>图片通过后才会进入图库</span></h1>
        <div class="account">
            <span class="who" id="whoami">…</span>
            <a href="/" id="homeLink">前台</a>
            <a href="/admin/profile" id="profileLink">个人信息</a>
            <a href="/admin" id="adminLink" hidden>返回后台</a>
            <a href="/admin/setting" id="settingLink" hidden>设置</a>
            <a href="/admin/users" id="usersLink" hidden>账户管理</a>
            <button class="theme-toggle" type="button" data-theme-toggle>☀️</button>
            <button class="ghost mini" id="logoutBtn">退出登录</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab active" data-status="pending">待审核 <b id="countPending">0</b></button>
        <button class="tab" data-status="approved">已通过 <b id="countApproved">0</b></button>
        <button class="tab" data-status="rejected">已拒绝 <b id="countRejected">0</b></button>
    </div>

    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>

    <footer class="site-footer">
        <span>© <span data-year>2026</span> <span data-footer-site>梦星的小图床</span> · img-api</span>
        <span>All rights reserved.</span>
    </footer>
</div>

<div class="toast" id="toast"></div>

<script>
    const BASE = location.pathname.replace(/\/admin(\/.*)?$/, '');
    const API = BASE + '/admin/api';
    const $ = (id) => document.getElementById(id);

    document.getElementById('homeLink').href = BASE + '/';
    document.getElementById('profileLink').href = BASE + '/admin/profile';
    document.getElementById('adminLink').href = BASE + '/admin';
    document.getElementById('settingLink').href = BASE + '/admin/setting';
    document.getElementById('usersLink').href = BASE + '/admin/users';

    const ROLE_LABELS = { owner: '站长', admin: '管理员', moderator: '审核员', member: '成员' };
    const STATUS_LABELS = { pending: '待审核', approved: '已通过', rejected: '已拒绝' };

    let currentUser = null;
    let status = 'pending';
    let page = 1;
    let toastTimer = null;

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));

    const toast = (message, isError = false) => {
        const el = $('toast');
        el.textContent = message;
        el.className = 'toast on' + (isError ? ' err' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.className = 'toast'; }, 2400);
    };

    const request = async (path, options = {}) => {
        const headers = Object.assign({}, options.headers || {});
        if (options.json !== undefined) {
            headers['Content-Type'] = 'application/json';
            options.body = JSON.stringify(options.json);
        }
        const response = await fetch(API + path, Object.assign({}, options, {
            headers,
            credentials: 'same-origin'
        }));
        if (response.status === 401) {
            location.href = BASE + '/login';
            throw new Error('登录已过期');
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || ('请求失败 ' + response.status));
        return data;
    };

    const fmtDate = (value) => {
        if (!value) return '-';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? '-' : date.toLocaleString('zh-CN', { hour12: false });
    };

    const renderPager = (data) => {
        if (data.pages <= 1) { $('pager').innerHTML = ''; return; }
        $('pager').innerHTML =
            '<button class="ghost mini" id="prevBtn" ' + (data.page <= 1 ? 'disabled' : '') + '>上一页</button>' +
            '<span class="info">' + data.page + ' / ' + data.pages + '</span>' +
            '<button class="ghost mini" id="nextBtn" ' + (data.page >= data.pages ? 'disabled' : '') + '>下一页</button>';
        $('prevBtn').onclick = () => { page = Math.max(1, page - 1); load(); };
        $('nextBtn').onclick = () => { page = Math.min(data.pages, page + 1); load(); };
    };

    const render = (data) => {
        $('countPending').textContent = data.stats?.pending ?? 0;
        $('countApproved').textContent = data.stats?.approved ?? 0;
        $('countRejected').textContent = data.stats?.rejected ?? 0;

        if (!data.images.length) {
            const labels = { pending: '没有待审核图片', approved: '还没有已通过的图片', rejected: '还没有被拒绝的图片' };
            $('grid').innerHTML = '<div class="empty">' + labels[status] + '</div>';
            $('pager').innerHTML = '';
            return;
        }

        $('grid').innerHTML = data.images.map((image) => {
            const thumb = image.webpUrl || image.url;
            const tags = (image.tags || []).join(', ');
            const actions = [];

            if (image.status !== 'approved') {
                actions.push('<button class="ok mini" data-approve="' + esc(image.id) + '">通过</button>');
            }
            if (image.status !== 'rejected') {
                actions.push('<button class="danger mini" data-reject="' + esc(image.id) + '">拒绝</button>');
            }
            if (image.status !== 'pending') {
                actions.push('<button class="ghost mini" data-pending="' + esc(image.id) + '">打回待审</button>');
            }

            return '<div class="card">' +
                '<img src="' + esc(thumb) + '" alt="' + esc(image.id) + '" loading="lazy" ' +
                    'onclick="window.open(\'' + esc(image.url) + '\',\'_blank\')">' +
                '<div class="body">' +
                    '<div class="meta">' +
                        '<span class="badge ' + esc(image.status) + '">' + (STATUS_LABELS[image.status] || image.status) + '</span>' +
                        '<span>' + image.width + '×' + image.height + '</span>' +
                    '</div>' +
                    '<div class="title">' + esc(image.title || image.id) + '</div>' +
                    '<div class="sub">上传者：' + esc(image.owner || '未知') + ' · ' + esc(fmtDate(image.createdAt)) + '</div>' +
                    (tags ? '<div class="tags">#' + esc(tags) + '</div>' : '') +
                    (image.reviewNote ? '<div class="note">审核备注：' + esc(image.reviewNote) + '</div>' : '') +
                    '<div class="actions">' + actions.join('') + '</div>' +
                '</div>' +
            '</div>';
        }).join('');

        renderPager(data);
    };

    const load = async () => {
        try {
            const data = await request('/review?status=' + encodeURIComponent(status) + '&page=' + page);
            render(data);
        } catch (error) {
            toast(error.message, true);
        }
    };

    const setStatus = async (id, nextStatus) => {
        let note = '';

        if (nextStatus === 'rejected') {
            const value = prompt('拒绝原因（可选，会显示在审核记录里）');
            if (value === null) return;
            note = value.trim();
        }

        try {
            await request('/review/' + id, { method: 'PATCH', json: { status: nextStatus, note } });
            toast(nextStatus === 'approved' ? '已通过，图片进入图库' : (nextStatus === 'rejected' ? '已拒绝' : '已打回待审'));
            await load();
        } catch (error) {
            toast(error.message, true);
        }
    };

    $('grid').addEventListener('click', (event) => {
        const target = event.target;
        const id = target.dataset.approve || target.dataset.reject || target.dataset.pending;
        if (!id) return;

        if (target.dataset.approve) return setStatus(id, 'approved');
        if (target.dataset.reject) return setStatus(id, 'rejected');
        if (target.dataset.pending) return setStatus(id, 'pending');
    });

    document.querySelectorAll('.tab').forEach((tab) => {
        tab.onclick = () => {
            status = tab.dataset.status;
            page = 1;
            document.querySelectorAll('.tab').forEach((item) => item.classList.toggle('active', item === tab));
            load();
        };
    });

    $('logoutBtn').onclick = async () => {
        try {
            await request('/auth/logout', { method: 'POST' });
        } catch {
            // 会话已经失效也没关系
        }
        location.href = BASE + '/login';
    };

    const boot = async () => {
        try {
            const me = await request('/auth/me');
            currentUser = me.user;

            if (currentUser.role === 'member') {
                location.href = BASE + '/admin';
                return;
            }

            const canManage = currentUser.role === 'owner' || currentUser.role === 'admin';
            $('whoami').innerHTML = '<b>' + esc(currentUser.displayName || currentUser.username) + '</b> · ' +
                '<span class="role ' + esc(currentUser.role) + '">' + (ROLE_LABELS[currentUser.role] || currentUser.role) + '</span>';
            $('adminLink').hidden = !canManage;
            $('settingLink').hidden = !canManage;
            $('usersLink').hidden = !canManage;

            try {
                const settings = await request('/settings');
                document.title = (settings.siteName || '梦星的小图床') + ' · 审核台';
                document.querySelectorAll('[data-footer-site]').forEach((el) => {
                    el.textContent = settings.siteName || '梦星的小图床';
                });
            } catch {
                // 标题不是关键
            }

            await load();
        } catch (error) {
            toast(error.message, true);
        }
    };

    boot();
</script>
</body>
</html>
