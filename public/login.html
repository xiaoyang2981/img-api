<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦星的小图床 · 登录</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root {
        --bg: #12141a;
        --panel: rgba(255, 255, 255, 0.05);
        --border: rgba(255, 255, 255, 0.12);
        --text: #e8ebf2;
        --muted: #8b93a7;
        --accent: #50b7fe;
        --danger: #e74c3c;
    }
    body {
        background: radial-gradient(1200px 600px at 20% -10%, #1b2740 0%, var(--bg) 55%);
        color: var(--text);
        font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .card {
        width: min(420px, 100%);
        background: rgba(23, 26, 34, 0.92);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 30px;
        box-shadow: 0 26px 70px rgba(0, 0, 0, 0.45);
    }
    .logo { font-size: 2rem; margin-bottom: 10px; }
    h1 { font-size: 1.25rem; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: .84rem; line-height: 1.7; margin-bottom: 22px; }
    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    label { font-size: .8rem; color: var(--muted); }
    .code-row { display: flex; gap: 8px; align-items: stretch; }
    .code-row input { flex: 1; min-width: 0; }
    .code-row button {
        width: auto;
        margin: 0;
        padding: 0 12px;
        font-size: .8rem;
        white-space: nowrap;
    }
    input {
        width: 100%;
        background: rgba(0, 0, 0, .28);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 11px 13px;
        font-size: .92rem;
        outline: none;
        font-family: inherit;
    }
    input:focus { border-color: var(--accent); }
    button {
        width: 100%;
        background: linear-gradient(45deg, #50b7fe, #3aa7fe);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 11px 16px;
        font-size: .92rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        margin-top: 4px;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .error {
        display: none;
        background: rgba(231, 76, 60, .13);
        border: 1px solid rgba(231, 76, 60, .35);
        color: #ff9b90;
        border-radius: 9px;
        padding: 9px 12px;
        font-size: .82rem;
        line-height: 1.6;
        margin-bottom: 14px;
    }
    .error.on { display: block; }
    .notice {
        display: none;
        background: rgba(80, 183, 254, .1);
        border: 1px solid rgba(80, 183, 254, .32);
        color: #a9dbff;
        border-radius: 9px;
        padding: 10px 12px;
        font-size: .82rem;
        line-height: 1.7;
        margin-bottom: 14px;
    }
    .notice.on { display: block; }
    .notice a { color: var(--accent); }
    .switch-line {
        color: var(--muted);
        font-size: .8rem;
        text-align: center;
        margin-top: 16px;
        min-height: 1.2em;
    }
    .switch-line a { color: var(--accent); text-decoration: none; }
    .foot { margin-top: 10px; color: var(--muted); font-size: .76rem; line-height: 1.7; text-align: center; }
    .foot a { color: var(--accent); text-decoration: none; }
    .hidden { display: none !important; }
</style>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body>
<div class="card">
    <button class="theme-toggle theme-toggle-card" type="button" data-theme-toggle>☀️</button>
    <div class="logo">🖼️</div>
    <h1 id="title">登录图床</h1>
    <p class="sub" id="subtitle">使用你的账户登录。</p>

    <div class="error" id="error"></div>
    <div class="notice" id="notice"></div>

    <form id="form" autocomplete="on">
        <div class="field">
            <label for="username" id="usernameLabel">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field hidden" id="emailField">
            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" autocomplete="email">
        </div>
        <div class="field hidden" id="codeField">
            <label for="code">邮箱验证码</label>
            <div class="code-row">
                <input id="code" name="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位验证码">
                <button type="button" id="sendCodeBtn">发送验证码</button>
            </div>
        </div>
        <div class="field hidden" id="displayNameField">
            <label for="displayName">显示名（可选）</label>
            <input id="displayName" name="displayName" type="text" autocomplete="nickname">
        </div>
        <div class="field">
            <label for="password" id="passwordLabel">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="field hidden" id="confirmField">
            <label for="confirm">确认密码</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password">
        </div>
        <button id="submitBtn" type="submit">登录</button>
    </form>

    <p class="switch-line" id="switchLine"></p>
    <p class="foot"><a href="/" id="homeLink">← 返回首页</a> · <a href="/docs" id="docsLink">使用文档</a></p>
    <p class="login-copyright">© <span data-year>2026</span> <span data-footer-site>梦星的小图床</span> · img-api · All rights reserved.</p>
</div>

<script>
    const path = location.pathname.replace(/\/+$/, '') || '/';
    const BASE = path.replace(/\/(?:admin(?:\/login)?|login|register)$/, '');
    const API = BASE + '/admin/api';
    const isRegisterPath = /\/register$/.test(path);
    const isAdminPath = /\/admin(\/login)?$/.test(path);

    const $ = (id) => document.getElementById(id);
    let mode = 'login';
    let allowRegistration = true;
    let emailVerification = false;
    let emailConfigured = false;
    let siteName = '梦星的小图床';
    let busy = false;

    document.getElementById('homeLink').href = BASE + '/';
    document.getElementById('docsLink').href = BASE + '/docs';

    const showError = (message) => {
        const el = $('error');
        el.textContent = message || '';
        el.classList.toggle('on', Boolean(message));
    };

    const showNotice = (html) => {
        const el = $('notice');
        el.innerHTML = html || '';
        el.classList.toggle('on', Boolean(html));
    };

    const request = async (apiPath, options = {}) => {
        const headers = Object.assign({}, options.headers || {});
        if (options.json !== undefined) {
            headers['Content-Type'] = 'application/json';
            options.body = JSON.stringify(options.json);
        }

        const response = await fetch(API + apiPath, {
            ...options,
            headers,
            credentials: 'same-origin'
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(data.message || ('请求失败 ' + response.status));
        }

        return data;
    };

    const setSwitch = (html) => {
        $('switchLine').innerHTML = html || '';
    };

    const applyMode = (nextMode) => {
        mode = nextMode;

        const isSetup = mode === 'setup';
        const isRegister = mode === 'register';
        const isReset = mode === 'reset';
        const needsConfirm = isSetup || isRegister || isReset;
        const needsEmail = isRegister && emailVerification;
        const needsCode = needsEmail || isReset;

        $('title').textContent = isSetup
            ? '初始化站长'
            : (isRegister ? '注册账户' : (isReset ? '重置密码' : '登录图床'));
        $('subtitle').textContent = isSetup
            ? '第一次使用，先创建站长账户。'
            : (isRegister
                ? (emailVerification ? '注册需要邮箱验证码，验证后即可登录。' : '注册后即可上传图片、管理自己的作品。')
                : (isReset
                    ? '输入用户名或邮箱，获取验证码后设置新密码。'
                    : '使用你的账户登录，管理图床和图片。'));
        document.title = siteName + ' · ' + (isSetup ? '初始化' : (isRegister ? '注册' : (isReset ? '重置密码' : '登录')));

        $('usernameLabel').textContent = isReset ? '用户名或邮箱' : '用户名';
        $('displayNameField').classList.toggle('hidden', !isRegister);
        $('emailField').classList.toggle('hidden', !needsEmail);
        $('codeField').classList.toggle('hidden', !needsCode);
        $('email').required = needsEmail;
        $('code').required = needsCode;
        $('confirmField').classList.toggle('hidden', !needsConfirm);
        $('confirm').required = needsConfirm;
        $('passwordLabel').textContent = isReset ? '新密码' : '密码';
        $('password').autocomplete = needsConfirm ? 'new-password' : 'current-password';
        $('submitBtn').textContent = isSetup
            ? '创建站长并进入'
            : (isRegister ? '注册并登录' : (isReset ? '重置密码' : '登录'));

        $('form').hidden = false;
        showError('');
        showNotice('');

        if (isSetup) {
            setSwitch('');
        } else if (isRegister) {
            setSwitch('已有账户？<a href="' + BASE + '/login">去登录</a>');
        } else if (isReset) {
            setSwitch('<a href="#" data-action="login">返回登录</a>');
        } else {
            const lines = [];
            lines.push(allowRegistration
                ? '还没有账户？<a href="' + BASE + '/register">注册一个</a>'
                : '注册暂未开放，请联系站长或管理员创建账户');
            if (emailVerification && emailConfigured) {
                lines.push('<a href="#" data-action="forgot">忘记密码？</a>');
            }
            setSwitch(lines.join('<br>'));
        }
    };

    const applyUnavailable = (title, message, linkHtml) => {
        $('title').textContent = title;
        $('subtitle').textContent = message;
        document.title = siteName + ' · ' + title;
        $('form').hidden = true;
        setSwitch(linkHtml || '');
    };

    const redirectTarget = () => {
        const next = new URLSearchParams(location.search).get('next');
        if (next && next.startsWith('/') && !next.startsWith('//')) return next;
        return BASE + '/admin';
    };

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    const startCooldown = () => {
        const button = $('sendCodeBtn');
        let left = 60;
        button.disabled = true;
        button.textContent = left + 's';

        const timer = setInterval(() => {
            left -= 1;
            if (left <= 0) {
                clearInterval(timer);
                button.disabled = false;
                button.textContent = '发送验证码';
            } else {
                button.textContent = left + 's';
            }
        }, 1000);
    };

    $('sendCodeBtn').onclick = async () => {
        showError('');
        showNotice('');

        try {
            if (mode === 'register') {
                const email = $('email').value.trim();
                if (!emailPattern.test(email)) {
                    showError('请输入正确的邮箱地址');
                    return;
                }
                await request('/auth/register-code', { method: 'POST', json: { email } });
                showNotice('验证码已发送，请查收邮箱（包括垃圾箱）。');
            } else if (mode === 'reset') {
                const identifier = $('username').value.trim();
                if (!identifier) {
                    showError('请先填写用户名或邮箱');
                    return;
                }
                await request('/auth/forgot-password', { method: 'POST', json: { identifier } });
                showNotice('如果账户绑定了邮箱，验证码已经发送，请查收。');
            } else {
                return;
            }

            startCooldown();
        } catch (error) {
            showError(error.message);
        }
    };

    $('switchLine').addEventListener('click', (event) => {
        const action = event.target.closest('[data-action]')?.dataset.action;
        if (!action) return;

        event.preventDefault();
        if (action === 'forgot') applyMode('reset');
        if (action === 'login') applyMode('login');
    });

    $('form').addEventListener('submit', async (event) => {
        event.preventDefault();
        if (busy) return;

        showError('');
        showNotice('');

        const username = $('username').value.trim();
        const password = $('password').value;
        const displayName = $('displayName').value.trim();
        const isSetup = mode === 'setup';
        const isRegister = mode === 'register';
        const isReset = mode === 'reset';
        const needsConfirm = isSetup || isRegister || isReset;

        if (!username || !password) {
            showError('请填写用户名和密码');
            return;
        }
        if (needsConfirm && password !== $('confirm').value) {
            showError('两次输入的密码不一致');
            return;
        }
        if (needsConfirm && password.length < 8) {
            showError('密码至少 8 位');
            return;
        }

        const payload = { username, password };

        if (isRegister) {
            payload.displayName = displayName;

            if (emailVerification) {
                const email = $('email').value.trim();
                const code = $('code').value.trim();

                if (!emailPattern.test(email)) {
                    showError('请输入正确的邮箱地址');
                    return;
                }
                if (!/^\d{6}$/.test(code)) {
                    showError('请输入 6 位邮箱验证码');
                    return;
                }

                payload.email = email;
                payload.code = code;
            }
        }

        if (isReset) {
            const code = $('code').value.trim();
            if (!/^\d{6}$/.test(code)) {
                showError('请输入 6 位邮箱验证码');
                return;
            }

            payload.identifier = username;
            payload.code = code;
            payload.newPassword = password;
            delete payload.username;
            delete payload.password;
        }

        const endpoint = isSetup
            ? '/auth/setup'
            : (isRegister ? '/auth/register' : (isReset ? '/auth/reset-password' : '/auth/login'));

        busy = true;
        $('submitBtn').disabled = true;

        try {
            if (isReset) {
                await request(endpoint, { method: 'POST', json: payload });
                applyMode('login');
                $('username').value = username.includes('@') ? '' : username;
                $('password').value = '';
                $('confirm').value = '';
                $('code').value = '';
                showNotice('密码已重置，请使用新密码登录。');
                busy = false;
                $('submitBtn').disabled = false;
                $('password').focus();
                return;
            }

            const result = await request(endpoint, { method: 'POST', json: payload });
            const next = new URLSearchParams(location.search).get('next');

            if (result.user?.role === 'moderator' && !next) {
                location.href = BASE + '/admin/review';
            } else {
                location.href = redirectTarget();
            }
        } catch (error) {
            showError(error.message);
            busy = false;
            $('submitBtn').disabled = false;
        }
    });

    const boot = async () => {
        try {
            const status = await request('/auth/status');
            allowRegistration = status.allowRegistration !== false;
            emailVerification = Boolean(status.enableEmailVerification);
            emailConfigured = Boolean(status.emailConfigured);
            siteName = status.siteName || siteName;
            document.querySelectorAll('[data-footer-site]').forEach((el) => {
                el.textContent = siteName;
            });

            if (status.authenticated) {
                location.href = BASE + '/admin';
                return;
            }

            if (status.setup) {
                if (isRegisterPath) {
                    applyUnavailable(
                        '系统尚未初始化',
                        '还没有站长账户，请先到后台创建站长。',
                        '<a href="' + BASE + '/admin">前往初始化</a>'
                    );
                    return;
                }
                applyMode('setup');
                return;
            }

            if (isRegisterPath) {
                if (!allowRegistration) {
                    applyUnavailable(
                        '注册暂未开放',
                        '站长或管理员关闭了公开注册，请联系站长或管理员创建账户。',
                        '<a href="' + BASE + '/login">去登录</a>'
                    );
                    return;
                }
                if (emailVerification && !emailConfigured) {
                    applyUnavailable(
                        '邮箱验证暂不可用',
                        '邮箱验证已经开启，但 SMTP 尚未配置，暂时无法注册。',
                        '<a href="' + BASE + '/login">去登录</a>'
                    );
                    return;
                }
                applyMode('register');
                return;
            }

            applyMode('login');
        } catch (error) {
            showError(error.message);
            applyMode('login');
        }

        $('username').focus();
    };

    boot();
</script>
</body>
</html>
